

<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gerador de Conversas WhatsApp – Chatbot Negociador</title><style>  :root { --verde:#075E54; --verde2:#128C7E; --claro:#25D366; --bg:#f4f6f8; --txt:#1f2933; --mut:#6b7785; }  * { box-sizing: border-box; }  body { margin:0; font-family:"Segoe UI", Roboto, Helvetica, Arial, "Segoe UI Emoji", "Noto Color Emoji", sans-serif; background:var(--bg); color:var(--txt); }  header.top { background:var(--verde); color:#fff; padding:18px 28px; }  header.top h1 { margin:0; font-size:20px; font-weight:600; }  header.top p { margin:4px 0 0; opacity:.85; font-size:13px; }  main { max-width:1180px; margin:0 auto; padding:22px; display:grid; gap:18px; }  .card { background:#fff; border-radius:10px; padding:18px 20px; box-shadow:0 1px 3px rgba(0,0,0,.08); }  .card h2 { margin:0 0 12px; font-size:15px; color:var(--verde); }  #drop { border:2px dashed #b8c4cf; border-radius:10px; padding:34px; text-align:center; cursor:pointer; transition:.15s; }  #drop.over { border-color:var(--claro); background:#effcf3; }  #drop b { color:var(--verde2); }  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }  label.small { font-size:13px; color:var(--mut); }  input[type=text] { padding:8px 10px; border:1px solid #cdd5dd; border-radius:6px; font-size:14px; width:180px; }  button { background:var(--verde2); color:#fff; border:0; border-radius:6px; padding:10px 18px; font-size:14px; cursor:pointer; font-weight:600; }  button:hover { background:var(--verde); }  button:disabled { background:#a9b6c2; cursor:not-allowed; }  button.sec { background:#fff; color:var(--verde2); border:1px solid var(--verde2); padding:5px 10px; font-size:12px; font-weight:500; }  table { width:100%; border-collapse:collapse; font-size:13px; }  th, td { text-align:left; padding:7px 8px; border-bottom:1px solid #edf0f3; }  th { background:#f7f9fa; color:var(--mut); font-weight:600; position:sticky; top:0; }  .tbl { max-height:360px; overflow:auto; }  .warn { color:#b45309; font-weight:600; }  .err { color:#b91c1c; }  .ok { color:#15803d; }  progress { width:320px; height:14px; }  .legend { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:4px 18px; font-size:12.5px; color:#3d4852; }  .legend code { background:#eef2f5; padding:1px 5px; border-radius:4px; font-size:12px; }  details summary { cursor:pointer; color:var(--verde2); font-weight:600; font-size:13px; }  #preview { display:flex; flex-direction:column; align-items:center; gap:14px; background:#dfe3e7; padding:16px; border-radius:8px; max-height:900px; overflow:auto; }  #preview .page { transform-origin: top center; box-shadow:0 2px 10px rgba(0,0,0,.2); }  /* menu de contexto / editor de mensagens */  #preview .msg, #preview .btns { cursor:context-menu; }  #preview .msg:hover { outline:2px solid rgba(18,140,126,.45); outline-offset:1px; }  #preview .msg.sel { outline:2px solid #128C7E; }  #ctxMenu { position:fixed; z-index:1000; background:#fff; border-radius:8px; box-shadow:0 6px 24px rgba(0,0,0,.22); padding:5px 0; min-width:240px; display:none; font-size:13.5px; }  #ctxMenu div { padding:8px 16px; cursor:pointer; } #ctxMenu div:hover { background:#e8f5f2; }  #ctxMenu div.dis { color:#a0a9b3; pointer-events:none; } #ctxMenu hr { border:0; border-top:1px solid #edf0f3; margin:4px 0; }  #ctxMenu .del { color:#b91c1c; }  #modalBg { position:fixed; inset:0; background:rgba(15,23,42,.45); z-index:1001; display:none; align-items:center; justify-content:center; }  #modal { background:#fff; border-radius:10px; padding:18px 20px; width:640px; max-width:94vw; box-shadow:0 10px 40px rgba(0,0,0,.3); }  #modal h3 { margin:0 0 12px; font-size:16px; color:var(--verde); }  #modal .row label { font-size:12.5px; color:var(--mut); }  .badge { background:#fff3cd; color:#8a5a00; border-radius:4px; padding:1px 6px; font-size:11.5px; font-weight:600; }  .layWrap { display:grid; grid-template-columns: minmax(380px, 1fr) 460px; gap:18px; align-items:start; }  .layForm fieldset { border:1px solid #e3e8ec; border-radius:8px; margin:0 0 12px; padding:8px 12px 10px; }  .layForm legend { font-size:12.5px; font-weight:700; color:var(--verde); padding:0 6px; }  .layForm .lf { display:grid; grid-template-columns: 170px 1fr; align-items:center; gap:6px 10px; margin:5px 0; font-size:12.5px; }  .layForm .lf label { color:#3d4852; }  .layForm input[type=text], .layForm select { width:100%; padding:6px 8px; font-size:12.5px; min-width:0; }  .layForm input[type=color] { width:46px; height:28px; border:1px solid #cdd5dd; border-radius:5px; padding:1px; background:#fff; }  .layForm input[type=number] { width:80px; padding:6px; border:1px solid #cdd5dd; border-radius:6px; }  .layPrev { position:sticky; top:10px; background:#dfe3e7; border-radius:8px; padding:10px; height:760px; overflow:auto; }  .layPrev .scaler { transform:scale(.55); transform-origin:top left; width:794px; }  .layPrev .scaler .page { margin-bottom:14px; box-shadow:0 2px 10px rgba(0,0,0,.25); }  #liEditor { border:1px solid #e3e8ec; border-radius:10px; padding:14px 16px; background:#fbfcfd; }  #liEditor table td { vertical-align:middle; padding:5px 6px; }  #liEditor select, #liEditor input[type=text] { padding:6px 8px; font-size:12.5px; width:100%; min-width:0; }  #liEditor .ex { font-family:Consolas,monospace; font-size:12px; color:#334155; max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }  #liEditor .obr { color:#b91c1c; font-weight:700; }  #liEditor tr.cs-off td { opacity:.45; }  #liEditor td a { text-decoration:none; font-size:12.5px; }  .banner { background:#fff8e6; border:1px solid #f5d48a; border-radius:8px; padding:9px 12px; font-size:13px; margin:8px 0; }  /* editor de jornadas */  .fxbar { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
